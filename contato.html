        <section class="site"> 
            <h1>Universidade Brasil</h1>

    </header>
    <main> 
        <section class="container"> 
            <h2>Contato</h2> 
            <form> 
                <h3>Nome:</h3> 
                <input type="text" id="nome" name="nome" required> 
                <h3>Telefone:</h3> 
                <input type="tel" id="telefone" name="telefone" required> 
                <h3>E-mail:</h3> 
                <input type="email" id="email" name="email" required> 
                <h3>Assunto:</h3> 
                <input type="assunto" id="assunto" name="assunto" required> 
                <h3>Mensagem:</h3> 
                <textarea id="mensagem" name="mensagem" required></textarea> 
                <button type="submit" class="envio">Enviar</button> 
            </form>
        </section>
        <section class="mapa"> 
            <h2>Localização</h2> 
            <div class="mapa-container"> 
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3656.515423145501!2d-46.4554513!3d-23.5282611!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce66b4305002cf%3A0x1a40983635f28d82!2sUniversidade%20Brasil%20-%20Itaquera!5e0!3m2!1spt-BR!2sbr!4v1620000000000"

            </div>
        </section>
