<!DOCTYPE html> <!-- Define que o documento é HTML5 -->
<html lang="pt-br"> <!-- Define o idioma da página como Português-Brasil -->

<head>
    <meta charset="UTF-8"> <!-- Define a codificação de caracteres como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Garante que a página seja responsiva em dispositivos móveis -->
    <link rel="shortcut icon" href="img/logo-ub-head.png" type="image/x-icon"> <!--Icone de aba-->
    <!-- Importação dos arquivos CSS externos -->
    <link rel="stylesheet" href="css/reset.css"> <!-- Remove estilos padrão dos navegadores -->
    <link rel="stylesheet" href="css/header-footer.css"> <!-- Estilos do cabeçalho e rodapé -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/contato.css"> <!-- Estilos específicos da página de contato -->
    <title>Fale Conosco - Universidade Brasil</title> <!-- Define o título exibido na aba do navegador -->
</head>

<body>
    <header> <!-- Início do cabeçalho da página -->
        <section class="site"> <!-- Container principal do cabeçalho -->
            <h1>Universidade Brasil</h1> <!-- Nome da instituição exibido em destaque -->
            <div>
                <nav> <!-- Menu de navegação do site -->
                    <ul>
                        <li><a href="index.html">Home</a></li> <!-- Link para a página inicial -->
                        <li><a href="curso.html">Curso</a></li> <!-- Link para a página do curso -->
                        <!-- <li><a href="#servico">Serviço</a></li>  Link comentado (inativo) -->
                        <li><a href="professores.html">Equipe</a></li> <!-- Link para a página da equipe -->
                        <li><a href="contato.html">Contato</a></li>
                        <li><a href="login.html">Área do Professor</a></li> <!-- Link para a área de login -->
                    </ul>
                </nav>
            </div>
        </section>
    </header>
    <main> <!-- Início da área principal da página -->
        <section class="container"> <!-- Seção do formulário de contato -->
            <h2>Contato</h2> <!-- Título da seção -->

            <form> <!-- Início do formulário de envio -->
                <h3>Nome:</h3> <!-- Rótulo para o campo de nome -->
                <input type="text" id="nome" name="nome" required> <!-- Campo de texto para o nome -->
                <h3>Telefone:</h3> <!-- Rótulo para o campo de telefone -->
                <input type="tel" id="telefone" name="telefone" required> <!-- Campo de entrada para telefone -->
                <h3>E-mail:</h3> <!-- Rótulo para o campo de e-mail -->
                <input type="email" id="email" name="email" required> <!-- Campo de entrada para e-mail -->
                <h3>Mensagem:</h3> <!-- Rótulo para o campo de mensagem -->
                <textarea id="mensagem" name="mensagem" required></textarea> <!-- Área de texto para mensagem -->
                <button type="submit">Enviar</button> <!-- Botão para envio do formulário -->
            </form>
        </section>
        <section class="mapa"> <!-- Seção do mapa -->
            <h2>Localização</h2> <!-- Título da seção de localização -->
            <div class="mapa-container"> <!-- Container para o iframe do mapa -->
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3656.515423145501!2d-46.4554513!3d-23.5282611!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce66b4305002cf%3A0x1a40983635f28d82!2sUniversidade%20Brasil%20-%20Itaquera!5e0!3m2!1spt-BR!2sbr!4v1620000000000"
                    width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe> <!-- Mapa incorporado do Google Maps com localização da universidade -->
            </div>
        </section>
    </main>
</body>

</html>
